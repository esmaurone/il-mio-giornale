name: Aggiorna giornale

on:
  schedule:
    - cron: "0 7,11,20,23 * * *"   # orari UTC: 5 volte al giorno
  workflow_dispatch:                   # avvio manuale
  push:
    branches: [main]                   # si aggiorna anche quando modifichi i file

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  crea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera la pagina
        run: python genera_pagina.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

  pubblica:
    needs: crea
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
